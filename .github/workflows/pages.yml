name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # A weekly rebuild advances the permanent weekly Priority Brief rotation;
    # after PB-016, the 16-week sequence returns to PB-001.
    - cron: "17 12 * * 2"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_ASSET_PREFIX: ""
      NEXT_PUBLIC_SITE_PATH: ""
      NEXT_PUBLIC_SITE_URL: https://theanalyst.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run pages:prepare
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist/client
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
